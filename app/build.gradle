plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def packageAbis = (providers.gradleProperty('targetAbis')
    .orElse('arm64-v8a,armeabi-v7a,x86_64,x86')
    .get()).split(',').collect { it.trim() }.findAll { !it.isEmpty() }

android {
    namespace 'com.socks5proxy.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.socks5proxy.app"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "1.5.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ndk {
            abiFilters(*packageAbis)
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/release.keystore")
            storePassword "123456"
            keyAlias "release"
            keyPassword "123456"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation files('libs/libxray.aar')

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.10.1'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.09.02')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Embedded Tun2Socks native library
    implementation 'com.zaneschepke:hevtunnel:1.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
